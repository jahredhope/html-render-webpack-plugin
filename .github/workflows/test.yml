name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test (webpack ${{ matrix.webpack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        webpack:
          - "^5.112.0"
          - "5.111.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install webpack ${{ matrix.webpack }}
        if: matrix.webpack != '^5.112.0'
        run: |
          npm pkg set devDependencies.webpack=${{ matrix.webpack }}
          pnpm install --config.prefer-frozen-lockfile=false
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Typecheck tests
        run: pnpm lint.typecheck
      - name: Test
        run: pnpm test
      - name: Check package contents
        if: matrix.webpack == '^5.112.0'
        run: npm pack --dry-run
